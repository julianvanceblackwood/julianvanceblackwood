<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="258" viewBox="0 0 1400 258" role="img" aria-label="Research method, five stages from source evidence through state, inference, authority, and verification">
  <rect width="1400" height="258" fill="#151618"/>
  <g stroke="#55585B" stroke-width="1" fill="none">
    <path d="M58 58H1342M58 217H1342"/>
    <path d="M308 80V201M569 80V201M830 80V201M1091 80V201"/>
  </g>
  <text x="58" y="37" fill="#D7D7D4" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2">WORKING METHOD</text>
  <text x="1342" y="37" fill="#8F9395" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.4">EXPLICIT ASSUMPTIONS / REPRODUCIBLE RESULTS</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <g fill="#929698" font-size="13" letter-spacing="2">
      <text x="60" y="104">01</text><text x="324" y="104">02</text><text x="585" y="104">03</text><text x="846" y="104">04</text><text x="1107" y="104">05</text>
    </g>
    <g fill="#F3F2EF" font-size="25" font-weight="600">
      <text x="60" y="143">Source</text><text x="324" y="143">State</text><text x="585" y="143">Inference</text><text x="846" y="143">Authority</text><text x="1107" y="143">Evidence</text>
    </g>
    <g fill="#B9BBBC" font-size="15">
      <text x="60" y="173">Origin &amp; integrity</text><text x="324" y="173">Order &amp; recovery</text><text x="585" y="173">Models &amp; limits</text><text x="846" y="173">Policy &amp; permission</text><text x="1107" y="173">Tests &amp; review</text>
    </g>
  </g>
  <text x="59" y="243" fill="#AEB0B1" font-family="Arial,Helvetica,sans-serif" font-size="11.5" letter-spacing="1.6">OBSERVE → RECONSTRUCT → CHALLENGE → CONSTRAIN → REPRODUCE</text>
</svg>